
name: Test Markdown Links

on:
  push:
    paths:
      - "functions/_lib/markdown-links.js"
      - "tests/markdown-links.test.mjs"
      - ".github/workflows/test-markdown-links.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Markdown link tests
        run: node --test tests/markdown-links.test.mjs
