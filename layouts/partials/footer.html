
<style>
/* =================================
   FlowAnRiver Footer
================================= */


.footer.fr-footer {
  background: #E8DED0 !important;
  border-top: 1px solid #D8CCBC;
  color: #625A51;
  text-align: left;

  /* Remove theme footer width limits */
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 46px 28px 22px !important;
  box-sizing: border-box;
}


.fr-footer-inner {
  max-width: 1100px;
  margin: 0 auto;
}

.fr-footer-main {
  display: grid;
  grid-template-columns: 1.7fr 1fr 1fr;
  gap: 45px;
  padding-bottom: 36px;
}

/* Brand */

.fr-footer-brand {
  text-align: left;
}

.fr-footer-logo {
  display: inline-block;
  color: #302A23 !important;
  font-family: Georgia, serif;
  font-size: 24px;
  font-weight: 500;
  line-height: 1.3;
  text-decoration: none !important;
}

.fr-footer-tagline {
  margin: 12px 0 20px;
  color: #8A7F73;
  font-family: Georgia, serif;
  font-size: 13px;
  font-style: italic;
  line-height: 1.7;
}

/* Social media */

.fr-footer-social {
  display: flex;
  align-items: center;
  gap: 14px;
}

.fr-footer-social a {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 34px;
  height: 34px;
  color: #423A32 !important;
  text-decoration: none !important;
  border: 1px solid #CFC1B0;
  border-radius: 50%;
  transition: background 0.2s, border-color 0.2s;
}

.fr-footer-social a:hover {
  background: #DCD0C1;
  border-color: #A99986;
}

.fr-footer-social svg {
  width: 16px;
  height: 16px;
}

/* Navigation */

.fr-footer-column {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 12px;
}

.fr-footer-heading {
  margin: 0 0 7px;
  color: #8C7B69;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.fr-footer-column a {
  color: #625A51 !important;
  font-size: 12px;
  line-height: 1.5;
  text-decoration: none !important;
  transition: color 0.2s;
}

.fr-footer-column a:hover {
  color: #292521 !important;
}

/* Copyright */

.fr-footer-bottom {
  padding-top: 20px;
  border-top: 1px solid #D3C5B5;
  color: #928779;
  font-size: 11px;
  letter-spacing: 0.03em;
  text-align: center;
}

/* Dark mode */

[data-theme="dark"] .footer.fr-footer {
  background: #354038 !important;
  border-color: #48534B;
}

[data-theme="dark"] .fr-footer-logo,
[data-theme="dark"] .fr-footer-column a,
[data-theme="dark"] .fr-footer-social a {
  color: #EDE8DE !important;
}

[data-theme="dark"] .fr-footer-heading,
[data-theme="dark"] .fr-footer-tagline,
[data-theme="dark"] .fr-footer-bottom {
  color: #B5B9AC;
}

[data-theme="dark"] .fr-footer-social a {
  border-color: #697369;
}

[data-theme="dark"] .fr-footer-social a:hover {
  background: #48534B;
}

[data-theme="dark"] .fr-footer-bottom {
  border-color: #48534B;
}

/* Tablet */

@media (max-width: 900px) and (min-width: 601px) {
  .fr-footer-main {
    grid-template-columns: 1.3fr 1fr 1fr;
    gap: 22px;
  }
}

/* Mobile */

@media (max-width: 600px) {
  .footer.fr-footer {
    padding: 36px 22px 22px;
  }

  .fr-footer-main {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 30px 18px;
    padding-bottom: 28px;
  }

  .fr-footer-brand {
    grid-column: 1 / -1;
    text-align: center;
  }

  .fr-footer-logo {
    font-size: 23px;
  }

  .fr-footer-tagline {
    margin: 10px 0 16px;
  }

  .fr-footer-social {
    justify-content: center;
  }

  .fr-footer-column {
    gap: 13px;
  }

  .fr-footer-heading {
    font-size: 10px;
  }

  .fr-footer-column a {
    font-size: 12px;
  }

  .fr-footer-bottom {
    font-size: 10px;
    line-height: 1.7;
  }
}
</style>

<footer class="footer fr-footer">
  <div class="fr-footer-inner">

    <div class="fr-footer-main">

      <!-- Brand -->
      <div class="fr-footer-brand">

        <a class="fr-footer-logo"
           href="{{ "" | absLangURL }}">
          FlowAnRiver
        </a>

        <p class="fr-footer-tagline">
          Ideas, stories &amp; life in progress.
        </p>

        <div class="fr-footer-social">

          <!-- X -->
          <a href="https://x.com/Elaineoyml"
             target="_blank"
             rel="noopener noreferrer"
             aria-label="FlowAnRiver on X"
             title="Follow on X">

            <svg viewBox="0 0 24 24"
                 fill="currentColor"
                 aria-hidden="true">
              <path d="M18.901 1.153h3.68l-8.04 9.19L24 22.847h-7.406l-5.8-7.584-6.64 7.584H.47l8.6-9.83L0 1.153h7.594l5.243 6.932 6.064-6.932Zm-1.29 19.49h2.039L6.486 3.24H4.298l13.313 17.403Z"/>
            </svg>

          </a>
        </div>

      </div>

      <!-- Explore -->
      <nav class="fr-footer-column"
           aria-label="Explore">

        <h3 class="fr-footer-heading">Explore</h3>

        <a href="{{ "tags/ai/" | absLangURL }}">
          AI
        </a>

        <a href="{{ "tags/crypto/" | absLangURL }}">
          Crypto
        </a>

        <a href="{{ "tags/journal/" | absLangURL }}">
          Journal
        </a>

        <a href="{{ "about/" | absLangURL }}">
          About Us
        </a>

      </nav>

      <!-- Information -->
      <nav class="fr-footer-column"
           aria-label="Information">

        <h3 class="fr-footer-heading">Information</h3>

        <a href="{{ "contact/" | absLangURL }}">
          Contact Us
        </a>

        <a href="/privacy-policy/">
          Privacy Policy
        </a>

        <a href="/terms-of-service/">
          Terms of Service
        </a>

        <a href="/disclaimer/">
          Disclaimer
        </a>

        <a href="/faq/">
          FAQ
        </a>

      </nav>

    </div>

    <!-- Copyright -->
    <div class="fr-footer-bottom">
      &copy; {{ now.Year }} FlowAnRiver.
      All rights reserved.
    </div>

  </div>
</footer>
