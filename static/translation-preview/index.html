
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Translation Review | FlowAnRiver</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f7f4ef;
      color: #272420;
      font-family: -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      line-height: 1.7;
    }

    main {
      max-width: 1150px;
      margin: auto;
      padding: 35px 20px;
    }

    h1 { font-size: 27px; margin-bottom: 5px; }
    .subtitle { color: #777; margin-bottom: 28px; }

    .panel, .block {
      background: white;
      border: 1px solid #e8e2da;
      border-radius: 12px;
      padding: 22px;
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
    }

    input, textarea {
      width: 100%;
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 6px;
      margin-bottom: 14px;
      font: inherit;
    }

    textarea {
      min-height: 125px;
      resize: vertical;
      white-space: pre-wrap;
      background: #faf7f2;
    }

    button {
      background: #292622;
      color: white;
      border: 0;
      padding: 11px 20px;
      border-radius: 6px;
      cursor: pointer;
      margin: 0 8px 8px 0;
    }

    button:disabled { opacity: .5; cursor: default; }

    .columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .heading { font-weight: 700; margin-bottom: 8px; }

    .original {
      color: #333;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .meta {
      color: #777;
      font-size: 13px;
      margin-bottom: 13px;
    }

    .warning { color: #a15b20; font-size: 14px; }
    .status { margin: 18px 0; white-space: pre-wrap; }
    .save-status { font-size: 14px; margin-top: 8px; }
    .edited { color: #347252; }

    .footer {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    @media (max-width: 700px) {
      .columns { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<main>
  <h1>FlowAnRiver · 翻译审校</h1>
  <p class="subtitle">
    English Original / 中文人工修订 · 仅供内部审校
  </p>

  <section class="panel">
    <label for="article">文章 Slug</label>
    <input id="article" value="ai-agency-andreessen"
      autocomplete="off" spellcheck="false">

    <label for="token">Cloudflare 测试密钥</label>
    <input id="token" type="password"
      autocomplete="off" spellcheck="false">

    <button id="load" type="button">读取审校数据</button>
    <button id="translateBatch" type="button" disabled>
      翻译下一批（2个区块）
    </button>

    <p class="meta">
      修改后的译文将保存为内部草稿，不会自动审核通过或公开发布。
      密钥仅在当前页面内存使用，不保存到浏览器本地存储。
    </p>
  </section>

  <div id="status" class="status" role="status"></div>
  <div id="results"></div>

  <div class="footer">
    <button id="prev" type="button" disabled>上一批</button>
    <button id="next" type="button" disabled>下一批</button>
  </div>
</main>

<script>
(() => {
  const articleInput = document.getElementById("article");
  const tokenInput = document.getElementById("token");
  const results = document.getElementById("results");
  const status = document.getElementById("status");
  const loadButton = document.getElementById("load");
  const translateButton = document.getElementById("translateBatch");
  const prevButton = document.getElementById("prev");
  const nextButton = document.getElementById("next");

  let start = 0;
  let total = 0;
  let nextStart = 0;
  let currentArticle = "";
  let hasLoaded = false;
  let busy = false;
  let saving = false;
  let dirty = false;

  const PAGE_SIZE = 10;

  function validArticle(article) {
    return article.length <= 100 &&
      /^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(article);
  }

  function element(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) {
      node.textContent = String(text);
    }
    return node;
  }

  function updateButtons() {
    const locked = busy || saving;

    loadButton.disabled = locked;
    translateButton.disabled = locked || !hasLoaded;
    prevButton.disabled =
      locked || !hasLoaded || start === 0;
    nextButton.disabled =
      locked || !hasLoaded ||
      nextStart <= start || nextStart >= total;
  }

  function credentials() {
    const article = articleInput.value.trim();
    const token = tokenInput.value;

    if (!validArticle(article) || !token) {
      throw new Error("请输入正确的文章 Slug 和测试密钥。");
    }

    return { article, token };
  }

  function checkUnsaved() {
    if (!dirty) return true;
    return confirm("有尚未保存的中文修改，确定放弃吗？");
  }

  async function reviewRequest(article, token, position) {
    const response = await fetch(
      "/api/translation-review?article=" +
      encodeURIComponent(article) + "&start=" + position,
      {
        method: "POST",
        headers: { "X-Translate-Test-Token": token },
        cache: "no-store"
      }
    );

    if (!response.ok) {
      throw new Error("读取审校数据失败，HTTP " + response.status);
    }

    const data = await response.json();

    if (!Array.isArray(data.results) ||
        !Number.isInteger(data.total) ||
        !Number.isInteger(data.next_start)) {
      throw new Error("审校接口返回的数据格式不正确。");
    }

    return data;
  }

  function refreshDirty() {
    dirty = [...results.querySelectorAll("textarea[data-original-value]")]
      .some(area => area.value !== area.dataset.originalValue);
  }

  function render(data, article, position) {
    results.replaceChildren();

    start = position;
    total = data.total;
    nextStart = data.next_start;
    currentArticle = article;
    hasLoaded = true;
    dirty = false;

    status.textContent =
      "文章：" + article + " · 共 " + total +
      " 个区块 · 当前第 " +
      (total ? start + 1 : 0) + "–" +
      Math.min(nextStart, total) + " 个";

    for (const item of data.results) {
      const block = element("section", "block");

      block.appendChild(element(
        "div", "meta",
        `${item.id || "Unknown"} · ${item.type || "unknown"} · ${item.status || "unknown"}`
      ));

      const columns = element("div", "columns");
      const left = element("div");
      const right = element("div");

      left.appendChild(element(
        "div", "heading", "English Original"
      ));
      left.appendChild(element(
        "div", "original", item.original || ""
      ));

      right.appendChild(element(
        "div", "heading", "中文译文（可编辑）"
      ));

      if (item.id && typeof item.original === "string") {
        const area = element("textarea");
        area.value = item.translated || "";
        area.dataset.originalValue = area.value;
        area.setAttribute("aria-label", `${item.id} 中文译文`);
        area.maxLength = 10000;

        area.addEventListener("input", () => {
          refreshDirty();
          saveStatus.textContent = "存在尚未保存的修改";
        });

        right.appendChild(area);

        const saveButton = element("button", "", "保存修改");
        saveButton.type = "button";

        const saveStatus = element("p", "save-status");

        if (item.status === "edited_draft") {
          saveStatus.textContent = "已保存人工修改稿 · 尚未审核";
          saveStatus.classList.add("edited");
        } else if (item.translated) {
          saveStatus.textContent = "机器译文 · 尚未人工审核";
        } else {
          saveStatus.textContent = "尚未翻译，可直接填写中文";
        }

        saveButton.addEventListener("click", async () => {
          if (busy || saving) return;

          const newText = area.value.trim();

          if (!newText) {
            saveStatus.textContent = "请输入中文译文后再保存。";
            return;
          }

          const { article, token } = credentials();

          if (article !== currentArticle) {
            saveStatus.textContent =
              "文章已更改，请重新读取审校数据。";
            return;
          }

          saving = true;
          updateButtons();
          saveButton.disabled = true;
          area.disabled = true;
          saveStatus.textContent = "正在保存……";

          try {
            const response = await fetch(
              "/api/translation-save",
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "X-Translate-Test-Token": token
                },
                body: JSON.stringify({
                  article,
                  id: item.id,
                  original: item.original,
                  translated: newText
                }),
                cache: "no-store"
              }
            );

            const data = await response.json();

            if (!response.ok || data.saved !== true) {
              throw new Error(
                data.error || "保存失败，HTTP " + response.status
              );
            }

            area.value = newText;
            area.dataset.originalValue = newText;
            refreshDirty();

            saveStatus.textContent =
              "保存成功 · 人工修改稿 · 尚未审核";
            saveStatus.classList.add("edited");

          } catch (error) {
            saveStatus.textContent =
              error.message || "保存失败";
          } finally {
            saving = false;
            area.disabled = false;
            saveButton.disabled = false;
            updateButtons();
          }
        });

        right.append(saveButton, saveStatus);
      } else {
        right.appendChild(element(
          "div", "meta", "无法编辑此区块"
        ));
      }

      columns.append(left, right);
      block.appendChild(columns);

      const warnings = (item.validation?.warnings || [])
        .filter(w => w !== "missing_or_invalid_translation");

      if (warnings.length) {
        block.appendChild(element(
          "p", "warning",
          "自动检查提示：" + warnings.join("、")
        ));
      }

      results.appendChild(block);
    }

    updateButtons();
  }

  async function loadBatch(position) {
    if (busy || saving || !checkUnsaved()) return;

    busy = true;
    updateButtons();
    status.textContent = "正在读取审校数据……";

    try {
      const { article, token } = credentials();
      const data = await reviewRequest(article, token, position);
      render(data, article, position);
    } catch (error) {
      status.textContent = error.message || "读取失败";
    } finally {
      busy = false;
      updateButtons();
    }
  }

  async function translateNextBatch() {
    if (busy || saving || !hasLoaded || !checkUnsaved()) return;

    busy = true;
    updateButtons();
    status.textContent = "正在查找下一批待翻译区块……";

    try {
      const { article, token } = credentials();

      if (article !== currentArticle) {
        throw new Error("文章已更改，请先重新读取。");
      }

      let position = 0;
      let targetStart = null;

      while (position < 10000) {
        const data = await reviewRequest(
          article, token, position
        );

        const missing = data.results.find(item =>
          item.translate === true &&
          item.status === "not_translated" &&
          /^block-\d+$/.test(item.id || "")
        );

        if (missing) {
          const index = Number(missing.id.slice(6));
          targetStart = Math.floor(index / 2) * 2;
          break;
        }

        if (data.complete || data.next_start <= position) break;
        position = data.next_start;
      }

      if (targetStart === null) {
        status.textContent = "未发现待翻译区块。";
        return;
      }

      status.textContent =
        `正在处理第 ${targetStart + 1}–${Math.min(targetStart + 2, total)} 个区块……`;

      const response = await fetch(
        "/api/translate-batch?article=" +
        encodeURIComponent(article) +
        "&start=" + targetStart,
        {
          method: "POST",
          headers: { "X-Translate-Test-Token": token },
          cache: "no-store"
        }
      );

      if (!response.ok) {
        throw new Error("翻译失败，HTTP " + response.status);
      }

      const translation = await response.json();

      if (!Array.isArray(translation.results)) {
        throw new Error("翻译返回数据格式不正确。");
      }

      const page = Math.floor(targetStart / PAGE_SIZE) * PAGE_SIZE;
      const data = await reviewRequest(article, token, page);
      render(data, article, page);

      const failed = translation.results.filter(item =>
        item.status === "translation_failed" ||
        item.status === "needs_review"
      );

      status.textContent += failed.length
        ? "\n部分区块未成功翻译，请人工检查。"
        : "\n本批翻译处理完成，请检查中文译文。";

    } catch (error) {
      status.textContent = error.message || "翻译失败";
    } finally {
      busy = false;
      updateButtons();
    }
  }

  loadButton.addEventListener("click", () => loadBatch(0));

  translateButton.addEventListener(
    "click", translateNextBatch
  );

  prevButton.addEventListener("click", () => {
    if (currentArticle === articleInput.value.trim()) {
      loadBatch(Math.max(0, start - PAGE_SIZE));
    }
  });

  nextButton.addEventListener("click", () => {
    if (currentArticle === articleInput.value.trim()) {
      loadBatch(nextStart);
    }
  });

  for (const input of [articleInput, tokenInput]) {
    input.addEventListener("input", () => {
      hasLoaded = false;
      updateButtons();
    });
  }

  window.addEventListener("beforeunload", event => {
    if (dirty) {
      event.preventDefault();
      event.returnValue = "";
    }
  });

  updateButtons();
})();
</script>
</body>
</html>
